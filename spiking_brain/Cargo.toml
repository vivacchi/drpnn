[package]
name = "spiking_brain"
version = "0.2.0"
edition = "2021"
description = "Polychronous spiking network with R-STDP, structural plasticity, and DRP cost modeling."

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
# リアルタイム可視化 (オプション、visualizer bin でのみ使用)
macroquad = { version = "0.4", optional = true }

[features]
visualizer = ["macroquad"]

[profile.release]
opt-level = 3
lto = "thin"

[lib]
name = "spiking_brain"
path = "src/lib.rs"

[[bin]]
name = "continuous_brain"
path = "src/bin/continuous_brain.rs"

[[bin]]
name = "binary_brain"
path = "src/bin/binary_brain.rs"

[[bin]]
name = "drp_estimate"
path = "src/bin/drp_estimate.rs"

# Phase 2: 熱力学版 SNN (baseline)
[[bin]]
name = "thermo_m1_evaluation"
path = "src_phase2/bin/thermo_m1_evaluation.rs"

# Phase 2: 決定論性検証 (直列版 vs 並列版で完全一致確認)
[[bin]]
name = "verify_determinism"
path = "src_phase2/bin/verify_determinism.rs"

# Phase 2: 4位相ローテーション訓練版 (C10: 中間刺激)
[[bin]]
name = "thermo_m1_phase_input"
path = "src_phase2/bin/thermo_m1_phase_input.rs"

# Phase 2 Fork A: MIN_CONDUCTANCE 20→40
[[bin]]
name = "thermo_m1_evaluation_a"
path = "src_phase2_a/bin/thermo_m1_evaluation.rs"

# Phase 2 Fork B: 新生結線の decay 保護期間 (MATURATION_PERIOD 1000)
[[bin]]
name = "thermo_m1_evaluation_b"
path = "src_phase2_b/bin/thermo_m1_evaluation.rs"

# Phase 2 Fork C: Fork B + 新生結線 MIN_CONDUCTANCE=40
[[bin]]
name = "thermo_m1_evaluation_c"
path = "src_phase2_c/bin/thermo_m1_evaluation.rs"

# Phase 2 Fork D: 全シナプス初期 conductance=50 (信号均一化)
[[bin]]
name = "thermo_m1_evaluation_d"
path = "src_phase2_d/bin/thermo_m1_evaluation.rs"

# Phase 2 Fork E: 過剰接続版 (発生学的) — cortex 内 12800 plastic 結線 + 軸索成長
[[bin]]
name = "thermo_m1_evaluation_e"
path = "src_phase2_e/bin/thermo_m1_evaluation.rs"

# Phase 2 Fork F: 統合再設計 (vitality + LTP only + デール原則 + 過剰接続)
[[bin]]
name = "thermo_m1_evaluation_f"
path = "src_phase2_f/bin/thermo_m1_evaluation.rs"

# Phase 2 Fork F: リアルタイム可視化 (macroquad, GPU 描画)
#   build:  cargo build --release --features visualizer --bin thermo_visualizer
#   run:    cargo run   --release --features visualizer --bin thermo_visualizer
[[bin]]
name = "thermo_visualizer"
path = "src_phase2_f/bin/thermo_visualizer.rs"
required-features = ["visualizer"]

# Phase 2 Fork F: M0 蝸牛 → M1 統合パイプライン (音素 5 種識別)
[[bin]]
name = "m0_m1_pipeline"
path = "src_phase2_f/bin/m0_m1_pipeline.rs"

# Phase 2 Fork F: 内部状態レパートリ検証 (Kenet 2003 Phase 2 版)
[[bin]]
name = "internal_state_probe"
path = "src_phase2_f/bin/internal_state_probe.rs"

# Phase 2 Fork F: M0+M1+M2 3階層統合パイプライン (M2 A2 二次聴覚野)
[[bin]]
name = "m0_m1_m2_pipeline"
path = "src_phase2_f/bin/m0_m1_m2_pipeline.rs"

# Phase 2 Fork F: M0+M1+M2 B 案 (M2 内部 40→20 収束、 集約判断を物理プロセスに)
[[bin]]
name = "m0_m1_m2_pipeline_v2"
path = "src_phase2_f/bin/m0_m1_m2_pipeline_v2.rs"

# Phase 2 Fork F: M0 蝸牛出力の音素間分化度診断 (上流/下流の切り分け)
[[bin]]
name = "cochlea_differentiation"
path = "src_phase2_f/bin/cochlea_differentiation.rs"

# Phase 2 Fork F: Octopus 細胞 音素別オンセット応答診断 (M0.5 前段検証)
[[bin]]
name = "octopus_probe"
path = "src_phase2_f/bin/octopus_probe.rs"

# Phase 2 Fork F: M0 蝸牛 → M0.5 蝸牛神経核 → M1 パイプライン (3 細胞型 信号分解)
[[bin]]
name = "m0_cn_m1_pipeline"
path = "src_phase2_f/bin/m0_cn_m1_pipeline.rs"

# Phase 2 Fork F: M0 → M0.5 → M1 → M2 4 段 (改善 M1 上で M2 再挑戦)
[[bin]]
name = "m0_cn_m1_m2_pipeline"
path = "src_phase2_f/bin/m0_cn_m1_m2_pipeline.rs"

# Phase 2 Fork F: M1 に SHA-256 ハッシュを入力する実験 (高エントロピー入力応答)
[[bin]]
name = "m1_hash_probe"
path = "src_phase2_f/bin/m1_hash_probe.rs"

# Phase 2 Fork F: 子音は蝸牛から見て区別されているか (S1 検証)
[[bin]]
name = "consonant_probe"
path = "src_phase2_f/bin/consonant_probe.rs"

# Phase 2 Fork F: M1 の摂動感度 — カオス性の検査 (S11)
[[bin]]
name = "perturbation_probe"
path = "src_phase2_f/bin/perturbation_probe.rs"

# Phase 2 Fork F: F0 (音程) は表現されるか / 音程不変性
[[bin]]
name = "pitch_probe"
path = "src_phase2_f/bin/pitch_probe.rs"

# Phase 2 Fork F: 累積失聴 (M0.5 は繰り返し提示で聞こえなくなるか)
[[bin]]
name = "cumulative_deafness"
path = "src_phase2_f/bin/cumulative_deafness.rs"

# Phase 2 Fork F: 出力段の rate code (漏れ積分発火)
[[bin]]
name = "rate_code"
path = "src_phase2_f/bin/rate_code.rs"

# Phase 2 Fork F: M0 のゲートにレベル軸を入れる
[[bin]]
name = "level_axis"
path = "src_phase2_f/bin/level_axis.rs"

# Phase 2 Fork F: M0 の設計点を詰める (帯域数まで含めた掃引)
[[bin]]
name = "m0_design"
path = "src_phase2_f/bin/m0_design.rs"

# Phase 2 Fork F: 帯域数と選択性の幾何
[[bin]]
name = "band_coverage"
path = "src_phase2_f/bin/band_coverage.rs"

# Phase 2 Fork F: 子音は同じゲートを通るか
[[bin]]
name = "consonant_gate"
path = "src_phase2_f/bin/consonant_gate.rs"

# Phase 2 Fork F: M0 はフォルマントを区別できるか
[[bin]]
name = "formant_probe"
path = "src_phase2_f/bin/formant_probe.rs"

# Phase 2 Fork F: 背景活動ノイズの診断 (S10)
[[bin]]
name = "jitter_probe"
path = "src_phase2_f/bin/jitter_probe.rs"

# Phase 2 Fork F: M0 自発発火 (聴神経 spontaneous rate) 検証 (S9)
[[bin]]
name = "spontaneous_probe"
path = "src_phase2_f/bin/spontaneous_probe.rs"

# Phase 2 Fork F: 蝸牛 整数 biquad の自己発振検査 (S6)
[[bin]]
name = "biquad_limit_cycle"
path = "src_phase2_f/bin/biquad_limit_cycle.rs"

# Phase 2 Fork F: 蝸牛ゲート 計器修正版 (S5)
[[bin]]
name = "cochlea_gates_v2"
path = "src_phase2_f/bin/cochlea_gates_v2.rs"

# Phase 2 Fork F: 蝸牛の校正は帯域ごとに成り立っているか (S3 検証)
[[bin]]
name = "cochlea_calibration"
path = "src_phase2_f/bin/cochlea_calibration.rs"

# Phase 2 Fork F: 蝸牛の上限周波数 F_MAX は上げられるか (S2 検証)
[[bin]]
name = "fmax_sweep"
path = "src_phase2_f/bin/fmax_sweep.rs"

# Phase 3: M0 蝸牛 → M1 3D HCP 配置版 パイプライン (2D 版との直接比較用)
[[bin]]
name = "m0_m1_3d_pipeline"
path = "src_phase3_3d/bin/m0_m1_3d_pipeline.rs"

# Phase 3: M1 3D 単体 白色雑音識別 (M0 バイパス、 within=1.0 飽和診断用)
[[bin]]
name = "m1_3d_whitenoise"
path = "src_phase3_3d/bin/m1_3d_whitenoise.rs"

# Phase 2 DRAM: M0 蝸牛 → M1 DRAM 物理モデル版 パイプライン (V2 設計検証)
[[bin]]
name = "m0_m1_dram_pipeline"
path = "src_phase2_dram/bin/m0_m1_dram_pipeline.rs"

# Phase 2 DRAM: サーモメータ読み出し 物理検証 (二値 SA + WL 本数で多値化)
[[bin]]
name = "dram_thermometer_probe"
path = "src_phase2_dram/bin/dram_thermometer_probe.rs"
